name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Test (coverage >= 90%)
        run: ./scripts/check-coverage.sh
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint
        run: make lint-check GOLANGCI_LINT=golangci-lint
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
      - name: Documentation metadata
        run: |
          node --test scripts/llms-metadata.test.mjs
          node scripts/generate-llms.mjs
          git diff --exit-code -- docs/llms.txt
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Test latest Go on Windows
        run: go test -race ./...
  audit:
    # Snapshot provenance and tool bootstrap fixtures use macOS system tools.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Race tests on macOS
        run: go test -race ./...
      - name: Install pinned ShellCheck
        run: |
          shellcheck_bin="$(./scripts/bootstrap-shellcheck.sh "$RUNNER_TEMP/shellcheck")"
          printf '%s\n' "${shellcheck_bin%/*}" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Deadcode
        run: |
          output_file=$(mktemp)
          go run golang.org/x/tools/cmd/deadcode@v0.52.0 -test ./... > "$output_file"
          if [ -s "$output_file" ]; then
            cat "$output_file"
            exit 1
          fi
      - name: Security scan
        run: |
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          # gosec's pinned x/tools cannot read Go 1.27 export data.
          (
            cd "$tool_dir"
            go mod init goplaces-gosec
            go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0 golang.org/x/tools@v0.52.0
            go build -o "$tool_dir/gosec" github.com/securego/gosec/v2/cmd/gosec
          )
          "$tool_dir/gosec" ./...
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Source vulnerability scan
        run: '"$(go env GOPATH)/bin/govulncheck" -db=https://vuln.go.dev -test ./...'
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check --config .goreleaser.yml
      - name: Build credential-free snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=publish --config .goreleaser.yml
      - name: Snapshot binary vulnerability scan
        env:
          SNAPSHOT_REQUIRE_CLEAN: "1"
        run: ./scripts/verify-snapshot-security.sh
      - name: Reproducible cross-platform binaries
        run: ./scripts/test-reproducible-builds.sh dist
      - name: Release contract tests
        run: |
          ./scripts/test-macos-minimum.sh
          ./scripts/test-security-ci.sh
