name: release-check

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Tag CI is credential-free, but its release-contract mocks intentionally
    # exercise macOS-only producer and verifier boundaries.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Install pinned ShellCheck
        run: |
          shellcheck_bin="$(./scripts/bootstrap-shellcheck.sh "$RUNNER_TEMP/shellcheck")"
          printf '%s\n' "${shellcheck_bin%/*}" >> "$GITHUB_PATH"
      - name: Unit and race tests
        run: |
          go test ./...
          go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Install reviewed GitHub CLI
        # The contract suite resolves the real Homebrew gh, so the runner image's
        # preinstalled version must match EXPECTED_GH_VERSION in release-local.
        run: |
          brew update
          brew upgrade gh || brew install gh
          /opt/homebrew/opt/gh/bin/gh --version
      - name: Release contract tests
        run: |
          ./scripts/test-codesign-macos.sh
          ./scripts/test-release-assets.sh
          ./scripts/test-release-local.sh
          ./scripts/test-security-ci.sh
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Source vulnerability scan
        run: '"$(go env GOPATH)/bin/govulncheck" -db=https://vuln.go.dev -test ./...'
      - name: Build credential-free snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --snapshot --clean --skip=publish --config .goreleaser.yml
      - name: Snapshot binary vulnerability scan
        env:
          SNAPSHOT_REQUIRE_CLEAN: "1"
        run: ./scripts/verify-snapshot-security.sh
      - name: Reproduce snapshot binaries
        run: ./scripts/test-reproducible-builds.sh dist
