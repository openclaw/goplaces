name: release-check

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Independent credential-free validation; publication uses release.yml.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Install pinned ShellCheck
        run: |
          shellcheck_bin="$(./scripts/bootstrap-shellcheck.sh "$RUNNER_TEMP/shellcheck")"
          printf '%s\n' "${shellcheck_bin%/*}" >> "$GITHUB_PATH"
      - name: Unit and race tests
        run: |
          go test ./...
          go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Release contract tests
        run: |
          ./scripts/test-macos-minimum.sh
          ./scripts/test-security-ci.sh
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Source vulnerability scan
        run: '"$(go env GOPATH)/bin/govulncheck" -db=https://vuln.go.dev -test ./...'
      - name: Build credential-free snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=publish --config .goreleaser.yml
      - name: Snapshot binary vulnerability scan
        env:
          SNAPSHOT_REQUIRE_CLEAN: "1"
        run: ./scripts/verify-snapshot-security.sh
      - name: Reproduce snapshot binaries
        run: ./scripts/test-reproducible-builds.sh dist
